name: Deploy Quartz site to GitHub Pages
on:
  push:
    branches:
      - main
    # Step2: inbox/raw/tests 등 publish 비대상 tip은 Deploy 스킵
    paths:
      - "wiki/**"
      - "INDEX.md"
      - "assets/**"
      - "quartz.config.yaml"
      - "quartz-plugins/**"
      - "quartz.ts"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  # Prefer tip: frequent inbox pushes should not wait behind a doomed slow Pages sync.
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user vault
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checkout Quartz
        run: |
          git clone --depth 1 https://github.com/jackyzha0/quartz.git quartz-build

      - name: Cache Node Modules & Quartz Plugins
        id: quartz-cache
        uses: actions/cache@v4
        with:
          path: |
            quartz-build/node_modules
            quartz-build/.quartz/plugins
          key: ${{ runner.os }}-quartz-${{ hashFiles('quartz-build/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-quartz-

      - name: Install dependencies
        if: steps.quartz-cache.outputs.cache-hit != 'true'
        run: |
          cd quartz-build
          npm ci

      - name: Prepare Content
        run: |
          # Empty default Quartz content
          rm -rf quartz-build/content/*
          mkdir -p quartz-build/content

          # Step1 allowlist: published body only (align with quartz ignorePatterns)
          rsync -av wiki/ quartz-build/content/wiki/
          rsync -av assets/ quartz-build/content/assets/
          rsync -av quartz-plugins/ quartz-build/content/quartz-plugins/
          cp INDEX.md quartz-build/content/INDEX.md

      - name: Configure Quartz
        run: |
          # If user has custom quartz config YAML in root, copy it over.
          # Otherwise, copy the default and patch it.
          if [ -f "quartz.config.yaml" ]; then
            cp quartz.config.yaml quartz-build/quartz.config.yaml
          else
            cp quartz-build/quartz.config.default.yaml quartz-build/quartz.config.yaml
            node -e '
              const fs = require("fs");
              let config = fs.readFileSync("quartz-build/quartz.config.yaml", "utf8");
              // Update baseUrl
              config = config.replace(/baseUrl:\s*[^\r\n]*/, `baseUrl: wiki.askwho.net`);
              // Update pageTitle
              config = config.replace(/pageTitle:\s*[^\r\n]*/, `pageTitle: KM Wiki`);
              // Update locale to Korean
              config = config.replace(/locale:\s*[^\r\n]*/, `locale: ko-KR`);
              fs.writeFileSync("quartz-build/quartz.config.yaml", config);
            '
          fi
          
          # Allow overriding quartz.ts (for advanced overrides) if present in root
          if [ -f "quartz.ts" ]; then
            cp quartz.ts quartz-build/quartz.ts
          fi

      - name: Build Quartz Site
        run: |
          cd quartz-build
          npx quartz plugin install --from-config
          npx quartz build

      - name: Add CNAME
        run: |
          # Write CNAME to public directory for GitHub Pages custom domain routing
          echo "wiki.askwho.net" > quartz-build/public/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz-build/public
          
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://wiki.askwho.net
    steps:
      # deploy-pages hard-caps timeout at 600000ms and cancels on expiry
      # (Pages backend also enforces ~10m). Raising `timeout:` does not help.
      # Flake: build green + deploy stuck in syncing_files → Timeout → red;
      # next tip push usually recovers. See wiki/.../Org-Wiki-Pages-Deploy-Sync-Timeout.md
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
